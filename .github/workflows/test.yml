name: 🧪 Test

on:
  workflow_call:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
    paths:
      - "src/**"
      - "tools/**"
      - "test/**"
      - "lib/**"
      - ".github/workflows/test.yml"

permissions: {}

jobs:
  native-tests:
    name: Native tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run native tests
        run: |
          pio test -e native_downsample
          pio test -e native_logformat
          pio test -e native_version
          pio test -e native_colormap

  python-tests:
    name: Python tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run analyzer tests
        working-directory: tools
        run: uv run pytest
